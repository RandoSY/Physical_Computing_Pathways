name: Check curriculum software
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: g++ -std=c++11 -Wall -Wextra -Werror tests/core_test.cpp -o /tmp/pathways-test && /tmp/pathways-test
      - run: python -m host.instrument demo --seconds 1 --csv /tmp/capture.csv
      - run: python -m host.report /tmp/capture.csv --output /tmp/trace.html
  arduino-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.6
      - run: arduino-cli compile --fqbn arduino:avr:uno --warnings all firmware/arduino/PathwaysLab
